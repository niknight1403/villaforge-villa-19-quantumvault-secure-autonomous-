name: QuantumVault CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install fastapi uvicorn pytest pytest-cov
      - name: Run Tests with Coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=95
      - name: Linting
        run: pip install flake8 && flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t quantumvault-ai:latest .